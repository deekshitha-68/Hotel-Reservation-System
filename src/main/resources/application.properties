# ============================================================================
# Hotel Reservation System — Application Configuration
# ============================================================================

# --- Server ---
server.port=8080

# --- Database Connection ---
# Using H2 in-memory database for easy local development.
# To switch to MySQL, uncomment the MySQL section and comment out H2.

# H2 In-Memory Database (no setup required)
spring.datasource.url=jdbc:h2:mem:hotel_reservation_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Database (uncomment to use instead of H2)
# spring.datasource.url=jdbc:mysql://localhost:3306/hotel_reservation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' auto-creates/updates tables based on entity definitions.
# Use 'create-drop' during development if you want a fresh DB on each restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- SQL Initialization (seed data) ---
# Ensures data.sql runs AFTER Hibernate creates/updates the tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- JSON Date Formatting ---
spring.jackson.serialization.write-dates-as-timestamps=false
